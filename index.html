<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊分帳與收支小幫手</title>
  <style>
    :root {
      --primary: #4a90e2;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #333333;
      --border: #e1e4e8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 1.5rem 1rem; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 1.5rem; color: #2c3e50; }
    .card { background: var(--card); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h2 { font-size: 1.1rem; margin-bottom: 0.8rem; color: var(--primary); }
    .input-group { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    input, select { flex: 1; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
    button { background: var(--primary); color: white; border: none; padding: 0.6rem 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { opacity: 0.9; }
    .member-tag { display: inline-block; background: #eef5ff; color: var(--primary); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.85rem; margin: 0.2rem; }
    ul { list-style: none; }
    li { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    .settle-item { background: #eefbfa; border-left: 4px solid #2ec4b6; padding: 0.8rem; margin-bottom: 0.5rem; border-radius: 4px; font-weight: 500; }
    .del-btn { background: #ff4d4f; padding: 0.2rem 0.5rem; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="container">
  <h1>✈️ 旅遊分帳小幫手</h1>

  <!-- 1. 成員管理 -->
  <div class="card">
    <h2>1. 設定同行成員</h2>
    <div class="input-group">
      <input type="text" id="memberName" placeholder="輸入成員名字（如：小明）">
      <button onclick="addMember()">新增</button>
    </div>
    <div id="memberList"></div>
  </div>

  <!-- 2. 新增消費 -->
  <div class="card">
    <h2>2. 新增消費紀錄</h2>
    <div class="input-group">
      <input type="text" id="expenseTitle" placeholder="消費項目（如：晚餐、飯店）">
      <input type="number" id="expenseAmount" placeholder="金額 ($)">
    </div>
    <div class="input-group">
      <select id="payerSelect"><option value="">誰先墊錢？</option></select>
      <button onclick="addExpense()">記一筆</button>
    </div>
  </div>

  <!-- 3. 消費明細列表 -->
  <div class="card">
    <h2>3. 所有消費明細</h2>
    <ul id="expenseList"></ul>
  </div>

  <!-- 4. 結算結果 -->
  <div class="card">
    <h2>4. 最終分帳結果（誰給誰多少錢）</h2>
    <div id="settlementList"></div>
  </div>
</div>

<script>
  let members = [];
  let expenses = [];

  // 新增成員
  function addMember() {
    const input = document.getElementById('memberName');
    const name = input.value.trim();
    if (!name) return alert('請輸入姓名！');
    if (members.includes(name)) return alert('成員名稱重複！');

    members.push(name);
    input.value = '';
    renderMembers();
    updatePayerSelect();
    calculateSettlement();
  }

  function renderMembers() {
    const list = document.getElementById('memberList');
    list.innerHTML = members.map(m => `<span class="member-tag">👤 ${m}</span>`).join('');
  }

  function updatePayerSelect() {
    const select = document.getElementById('payerSelect');
    select.innerHTML = '<option value="">誰先墊錢？</option>' + 
      members.map(m => `<option value="${m}">${m}</option>`).join('');
  }

  // 新增消費紀錄
  function addExpense() {
    const title = document.getElementById('expenseTitle').value.trim();
    const amount = parseFloat(document.getElementById('expenseAmount').value);
    const payer = document.getElementById('payerSelect').value;

    if (!title || isNaN(amount) || amount <= 0 || !payer) {
      return alert('請填寫完整資訊（項目、金額與付款人）！');
    }
    if (members.length === 0) return alert('請先新增同行成員！');

    expenses.push({ id: Date.now(), title, amount, payer });
    document.getElementById('expenseTitle').value = '';
    document.getElementById('expenseAmount').value = '';

    renderExpenses();
    calculateSettlement();
  }

  function renderExpenses() {
    const list = document.getElementById('expenseList');
    if (expenses.length === 0) {
      list.innerHTML = '<li style="color:#888;">尚未有任何消費紀錄</li>';
      return;
    }
    list.innerHTML = expenses.map(e => `
      <li>
        <span><strong>${e.title}</strong> - $${e.amount} <small>(${e.payer} 付款)</small></span>
        <button class="del-btn" onclick="deleteExpense(${e.id})">刪除</button>
      </li>
    `).join('');
  }

  function deleteExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    renderExpenses();
    calculateSettlement();
  }

  // 自動計算分帳演算法
  function calculateSettlement() {
    const resultDiv = document.getElementById('settlementList');
    if (members.length === 0 || expenses.length === 0) {
      resultDiv.innerHTML = '<p style="color:#888;">加入成員與消費後自動計算</p>';
      return;
    }

    // 初始化所有人的收支平衡 (應收/應付)
    let balance = {};
    members.forEach(m => balance[m] = 0);

    // 計算每筆消費平均分配
    const totalPeople = members.length;
    expenses.forEach(e => {
      const perPerson = e.amount / totalPeople;
      // 付款人 +總額，但所有人（包含付款人）都要扣除均分額
      balance[e.payer] += e.amount;
      members.forEach(m => balance[m] -= perPerson);
    });

    // 分離欠錢者 (Debtors) 與該收錢者 (Creditors)
    let debtors = [];
    let creditors = [];

    for (let m in balance) {
      let b = Math.round(balance[m]); // 四捨五入到整數
      if (b < -1) debtors.push({ name: m, amount: -b });
      else if (b > 1) creditors.push({ name: m, amount: b });
    }

    // 計算最佳轉帳路徑
    let settlements = [];
    let i = 0, j = 0;

    while (i < debtors.length && j < creditors.length) {
      let debt = debtors[i].amount;
      let credit = creditors[j].amount;
      let payAmount = Math.min(debt, credit);

      settlements.push(`<strong>${debtors[i].name}</strong> 應支付 <strong>$${payAmount}</strong> 給 <strong>${creditors[j].name}</strong>`);

      debtors[i].amount -= payAmount;
      creditors[j].amount -= payAmount;

      if (debtors[i].amount < 1) i++;
      if (creditors[j].amount < 1) j++;
    }

    if (settlements.length === 0) {
      resultDiv.innerHTML = '<div class="settle-item">🎉 目前大家都結清了，互不相欠！</div>';
    } else {
      resultDiv.innerHTML = settlements.map(s => `<div class="settle-item">💵 ${s}</div>`).join('');
    }
  }
</script>

</body>
</html>
