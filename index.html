<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌊 旅遊記帳與分帳助手</title>
    <style>
        :root {
            --bg-cream: #FAF6F0;       /* 柔和米色背景 */
            --card-beige: #F3ECE1;     /* 卡片溫暖米黃色 */
            --ocean-dark: #1F4E5B;     /* 深海洋藍 (主要標題/按鈕) */
            --ocean-light: #2E7D8E;    /* 淺海藍 (次要標題) */
            --accent-coral: #E0A96D;   /* 沙灘暖色 (強調標示) */
            --text-dark: #2B2B2B;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            margin: 0;
            padding: 16px;
            font-size: 18px; /* 適合手機大字體 */
            line-height: 1.5;
        }

        h1, h2 {
            color: var(--ocean-dark);
            text-align: center;
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .card {
            background-color: var(--card-beige);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #E5DCCB;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
            color: var(--ocean-dark);
            font-size: 16px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid #CCC;
            font-size: 18px; /* 大字體輸入 */
            box-sizing: border-box;
            background-color: #FFF;
        }

        button.btn-primary {
            background-color: var(--ocean-dark);
            color: white;
            font-weight: bold;
            border: none;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button.btn-primary:active {
            background-color: var(--ocean-light);
        }

        button:disabled {
            background-color: #AAA;
            cursor: not-allowed;
        }

        .item-row {
            border-bottom: 1px solid #E5DCCB;
            padding: 10px 0;
            font-size: 16px;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        .badge-settled { background-color: #D4EDDA; color: #155724; }
        .badge-pending { background-color: #F8D7DA; color: #721C24; }
    </style>
</head>
<body>

    <h1>🏖️ 旅遊分帳與明細助手</h1>

    <!-- 消費輸入表單 -->
    <div class="card">
        <h2>📝 新增消費紀錄</h2>
        <form id="expenseForm">
            <label>項目說明</label>
            <input type="text" id="item" placeholder="例如：第一天晚餐" required>

            <label>總金額 ($)</label>
            <input type="number" id="amount" placeholder="9000" required>

            <label>消費類別</label>
            <select id="category">
                <option value="餐飲">🍽️ 餐飲</option>
                <option value="交通">🚗 交通</option>
                <option value="住宿">🏨 住宿</option>
                <option value="伴手禮">🎁 伴手禮</option>
                <option value="門票/娛樂">🎟️ 門票/娛樂</option>
                <option value="雜費">🛒 雜費</option>
            </select>

            <label>實際代墊者 (主要窗口)</label>
            <select id="payer">
                <option value="蓉">蓉 (窗口: 云, 閎, 蓉)</option>
                <option value="慈">慈 (窗口: 慈, 吳)</option>
                <option value="沛">沛 (窗口: 鵬, 沛, 畯, 璇)</option>
                <option value="鵬">鵬</option>
                <option value="云">云</option>
                <option value="閎">閎</option>
                <option value="吳">吳</option>
                <option value="畯">畯</option>
                <option value="璇">璇</option>
            </select>

            <label>受益/分攤成員 (以逗號分隔)</label>
            <input type="text" id="members" value="鵬,沛,蓉,云,閎,慈,吳,畯,璇">

            <label>是否屬代墊性質？</label>
            <select id="isAdvance">
                <option value="是">是 (需參與分帳)</option>
                <option value="否">否 (個人獨立花費)</option>
            </select>

            <label>分帳狀態</label>
            <select id="settleStatus">
                <option value="未分帳">❌ 未分帳</option>
                <option value="已分帳">✅ 已分帳 / 已付清</option>
            </select>

            <button type="button" id="submitBtn" class="btn-primary" onclick="submitData()">同步至 Google Sheet</button>
        </form>
    </div>

    <!-- 即時連動明細列表 -->
    <div class="card">
        <h2>📜 最新消費明細 (同步 Google Sheet)</h2>
        <div id="dataList">資料讀取中...</div>
    </div>

    <script>
        // 已帶入您提供的 Google Apps Script Web App URL
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyrZzupIe0nuod4zoB4YxLk2VYmeUR5FcLw3cJDmqmbh9WCIkkZFdaHUIe5J--0Mqti/exec";

        // 頁面開啟時自動向 Google Sheet 載入資料
        window.onload = function() {
            loadData();
        };

        // 1. 送出表單資料到 Google Sheet
        function submitData() {
            const submitBtn = document.getElementById("submitBtn");
            const item = document.getElementById("item").value;
            const amount = document.getElementById("amount").value;

            if (!item || !amount) {
                alert("請填寫項目說明與金額！");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "同步至 Google Sheet 中...";

            const payload = {
                item: item,
                amount: amount,
                category: document.getElementById("category").value,
                payer: document.getElementById("payer").value,
                members: document.getElementById("members").value,
                isAdvance: document.getElementById("isAdvance").value,
                settleStatus: document.getElementById("settleStatus").value
            };

            fetch(GAS_API_URL, {
                method: "POST",
                mode: "no-cors", // 跨網域存取 (CORS) 必備
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert("✅ 成功新增並同步至 Google Sheet！");
                document.getElementById("expenseForm").reset();
                document.getElementById("members").value = "鵬,沛,蓉,云,閎,慈,吳,畯,璇";
                submitBtn.disabled = false;
                submitBtn.innerText = "同步至 Google Sheet";
                
                // 1.5 秒後自動刷新明細清單
                setTimeout(loadData, 1500);
            })
            .catch(err => {
                alert("❌ 同步失敗：" + err);
                submitBtn.disabled = false;
                submitBtn.innerText = "同步至 Google Sheet";
            });
        }

        // 2. 從 Google Sheet 讀取最新明細
        function loadData() {
            fetch(GAS_API_URL)
            .then(res => res.json())
            .then(data => {
                const listDiv = document.getElementById("dataList");
                if (!data || data.length === 0) {
                    listDiv.innerHTML = "<p style='text-align:center;'>目前尚無紀錄</p>";
                    return;
                }

                let html = "";
                // 將最新新增的紀錄顯示在最上方
                data.slice().reverse().forEach(row => {
                    const itemName = row["項目說明"] || row.item || "未命名項目";
                    const itemAmt = row["總金額"] || row.amount || 0;
                    const itemPayer = row["實際代墊者"] || row.payer || "未知";
                    const itemCat = row["類別"] || row.category || "雜費";
                    const itemStatus = row["是否已分帳/結清"] || row.settleStatus || "未分帳";

                    const badgeClass = (itemStatus === "已分帳" || itemStatus === "已結清") ? "badge-settled" : "badge-pending";

                    html += `
                        <div class="item-row">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <strong>${itemName}</strong>
                                <span style="font-weight: bold; color: var(--ocean-dark);">$${itemAmt}</span>
                            </div>
                            <div style="font-size: 14px; color: #666; margin-top: 4px;">
                                付款人：<strong>${itemPayer}</strong> | 類別：${itemCat} 
                                <span class="badge ${badgeClass}" style="margin-left: 6px;">${itemStatus}</span>
                            </div>
                        </div>
                    `;
                });
                listDiv.innerHTML = html;
            })
            .catch(err => {
                document.getElementById("dataList").innerHTML = "<p style='text-align:center; color:red;'>無法載入資料，請確認 GAS 權限已開啟為「所有人」</p>";
            });
        }
    </script>
</body>
</html>
